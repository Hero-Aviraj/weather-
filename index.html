<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <div class="container">
        <div class="weather-card">
            <!-- Search Section -->
            <div class="search-section">
                <input type="text" id="cityInput" placeholder="Search City" class="search-input">
                <button id="searchBtn" class="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>

            <!-- Current Weather Section -->
            <div class="current-weather">
                <div class="location-date">
                    <div class="location">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                        <span id="cityName">Durgapur</span>
                    </div>
                    <div id="currentDate" class="date">Sunday, 4 Aug</div>
                </div>

                <div class="weather-main">
                    <div class="weather-icon-large">
                        <img id="mainWeatherIcon" src="" alt="weather">
                    </div>
                    <div class="temperature-section">
                        <h1 id="temperature" class="temperature">29°C</h1>
                        <p id="weatherDescription" class="weather-desc">Cloudy</p>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                        </svg>
                        <div class="detail-info">
                            <span class="detail-label">Humidity</span>
                            <span id="humidity" class="detail-value">65%</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
                        </svg>
                        <div class="detail-info">
                            <span class="detail-label">Wind Speed</span>
                            <span id="windSpeed" class="detail-value">11 M/s</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section" id="forecast">
                <!-- Forecast items will be dynamically inserted here -->
            </div>

            <!-- Loading Spinner -->
            <div id="loader" class="loader hidden">
                <div class="spinner"></div>
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="error-msg hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
